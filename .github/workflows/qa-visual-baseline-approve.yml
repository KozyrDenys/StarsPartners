name: QA Visual Baseline Approve

on:
  workflow_dispatch:
    inputs:
      brand:
        description: 'Brand key (gt, likes, booms, nix, starzino, igo, chacha, all)'
        required: true
        default: 'gt'
      mode:
        description: 'Execution mode (desktop, mobile, all)'
        required: true
        default: 'desktop'
      browser:
        description: 'Browser for baseline capture (chromium, webkit, firefox)'
        required: true
        default: 'chromium'
      create_pr:
        description: 'Create PR with updated snapshots'
        required: true
        default: 'true'

permissions:
  contents: write
  pull-requests: write

jobs:
  update_visual_baseline:
    name: Update visual baseline (${{ inputs.brand }} | ${{ inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit firefox

      - name: Update visual baselines
        run: npm run qa:visual:baseline:update -- --brand=${{ inputs.brand }} --mode=${{ inputs.mode }} --browser=${{ inputs.browser }}

      - name: Create PR with snapshot changes
        if: ${{ inputs.create_pr == 'true' }}
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/visual-baseline-${{ inputs.brand }}-${{ inputs.mode }}
          delete-branch: true
          title: 'chore: update visual baselines (${{ inputs.brand }} | ${{ inputs.mode }})'
          body: |
            Automated visual baseline refresh.

            - Brand: `${{ inputs.brand }}`
            - Mode: `${{ inputs.mode }}`
            - Browser: `${{ inputs.browser }}`

            Generated by workflow: `QA Visual Baseline Approve`.
          commit-message: 'chore(visual): refresh baselines for ${{ inputs.brand }} ${{ inputs.mode }}'
          add-paths: |
            tests/visual/**-snapshots/**
