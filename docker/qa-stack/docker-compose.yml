name: qa-stack

services:
  zap-baseline:
    image: ghcr.io/zaproxy/zaproxy:stable@sha256:c4da4c234258d444d9988fce9d034b00323724818daa4c91ca46f09aa04b46db
    profiles: ['zap']
    working_dir: /workspace
    volumes:
      - ../..:/workspace
    environment:
      TARGET_URL: ${BASE_URL:-https://gt.bet/}
      ZAP_OUT_DIR: ${ZAP_OUT_DIR:-artifacts/zap}
    entrypoint: ['/bin/sh', '-lc']
    command:
      [
        'mkdir -p "/workspace/$${ZAP_OUT_DIR}" && /zap/zap.sh -cmd -quickurl "$${TARGET_URL}" -quickout "/workspace/$${ZAP_OUT_DIR}/zap-baseline-compose.html"',
      ]

  lighthouse:
    image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    profiles: ['lighthouse']
    working_dir: /workspace
    shm_size: 1gb
    volumes:
      - ../..:/workspace
    environment:
      BASE_URL: ${BASE_URL:-https://gt.bet}
      CHROME_PATH: ${LHCI_CHROME_PATH:-/ms-playwright/chromium-1234/chrome-linux/chrome}
    command:
      [
        'npx',
        '--yes',
        '--package=@lhci/cli@0.15.1',
        'lhci',
        'collect',
        '--config=.lighthouserc.js',
        '--collect.settings.chromeFlags=--headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --no-zygote',
      ]
