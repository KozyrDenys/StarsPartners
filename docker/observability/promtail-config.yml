server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: qa-run-index
    static_configs:
      - targets: ['localhost']
        labels:
          job: qa-run-index
          app: qa-assistant
          __path__: /workspace/projects/dashboard/log-index/*.ndjson
