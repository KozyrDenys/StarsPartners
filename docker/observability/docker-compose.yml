name: qa-observability

services:
  loki:
    image: grafana/loki:3.1.1
    container_name: qa-loki
    command: ['-config.file=/etc/loki/config.yml']
    ports:
      - '3100:3100'
    volumes:
      - ./loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.1.1
    container_name: qa-promtail
    command: ['-config.file=/etc/promtail/config.yml']
    depends_on:
      - loki
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - ../..:/workspace:ro
      - promtail-data:/tmp
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.7.2
    container_name: qa-alloy
    profiles: ['alloy']
    command: ['run', '--server.http.listen-addr=0.0.0.0:12345', '/etc/alloy/config.river']
    depends_on:
      - loki
    ports:
      - '12345:12345'
    volumes:
      - ./alloy-config.river:/etc/alloy/config.river:ro
      - ../..:/workspace:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:11.1.4
    container_name: qa-grafana
    depends_on:
      - loki
    ports:
      - '3000:3000'
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped

volumes:
  loki-data:
  promtail-data:
  grafana-data:
