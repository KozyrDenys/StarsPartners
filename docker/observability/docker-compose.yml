name: qa-observability

services:
  loki:
    image: grafana/loki:3.7.3@sha256:70b9f699fc9bb868b62f1cfd4f787dfa50242f1fd92e6089787d5d7daea75fe8
    container_name: qa-loki
    command: ['-config.file=/etc/loki/config.yml']
    ports:
      - '3100:3100'
    volumes:
      - ./loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.17.1@sha256:4f6ddc56ffdcf8a6316748fc5162972e20cb301523cac1bb4a31957df733ae9b
    container_name: qa-alloy
    command: ['run', '--server.http.listen-addr=0.0.0.0:12345', '/etc/alloy/config.river']
    depends_on:
      - loki
    ports:
      - '12345:12345'
    volumes:
      - ./alloy-config.river:/etc/alloy/config.river:ro
      - ../..:/workspace:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.0@sha256:121a7a9ece6dc10b969f1f96eed64b4f07dfac0d0b8abc070f7cb83bbde86f63
    container_name: qa-grafana
    depends_on:
      - loki
    ports:
      - '3000:3000'
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped

volumes:
  loki-data:
  grafana-data:
